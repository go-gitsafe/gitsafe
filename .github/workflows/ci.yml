name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  # ⛔ A WORKFLOW THAT FAILS TO PARSE REPORTS NOTHING AT ALL -- no red cross, no
  # jobs, and `gh pr checks` answers "no checks reported on the branch", which
  # reads exactly like a check that has not started yet. It happened here on
  # 2026-10-05: an edit landed a step inside a two-key `with:` block, orphaning
  # the second key, and the only symptom was a run named after the FILE instead
  # of the workflow. actionlint is the only thing that catches it, so it is the
  # first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # The literaltick oracle FAILS, naming the shell, when one of these is not
      # installed: a runner without zsh must not read as a pass. macOS has no dash.
      GITSAFE_ORACLE_SHELLS: ${{ matrix.os == 'ubuntu-latest' && 'bash,dash,zsh' || 'bash,zsh' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      # The literaltick oracle asks bash, dash AND zsh (the shell the guarded
      # commands really run under); a runner without zsh would skip its half.
      - name: zsh for the literaltick oracle
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: nothing big is tracked
        shell: bash
        run: |
          # A repository carries what it is given for ever, and `go build` with
          # no -o writes an executable into the working tree named after the
          # package. One sweeping add later it is in the history of every
          # clone. That has happened in this fleet: 22 MB, and the history had
          # to be rewritten to get it out.
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +1M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 1 MB:"; echo "$big"; exit 1
          fi
      - run: gofmt -l . | tee /tmp/fmt.txt; test ! -s /tmp/fmt.txt
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=1 go test -race -count=1 ./...
      # cmd/guard-bash and every package it links are the gate every command
      # passes through; a block no test enters is a rule nobody has seen fire.
      # covblocks counts BLOCKS, because `go tool cover -func` rounds to one
      # decimal and passes at 99.95%, and it fails on an empty profile.
      # Keep the list equal to `go list -deps ./cmd/guard-bash` (in-module).
      - name: "guard-bash and its rule packages, every block entered"
        shell: bash
        run: |
          m=github.com/go-gitsafe/gitsafe
          pkgs=$m/cmd/guard-bash,$m/shellcmd,$m/amendmerged,$m/bypass,$m/chainedgate,$m/discard,$m/ghbyhand,$m/plain,$m/literaltick,$m/pipestatus,$m/bgstatus,$m/readback,$m/credurl,$m/secretarg,$m/shellwork,$m/sigpipe,$m/waiveenv,$m/sshweak,$m/stalebase,$m/testrun,$m/volatile
          GOBIN="$RUNNER_TEMP/bin" go install github.com/go-fleettools/fleettools/cmd/covblocks@v0.182.2
          go test -count=1 -coverpkg="$pkgs" -coverprofile="$RUNNER_TEMP/cover.out" ./...
          "$RUNNER_TEMP/bin/covblocks" "$RUNNER_TEMP/cover.out"

  docsym:
    name: the README against the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go version
      # ⛔ --fail IS THE WHOLE LANE. docsym REPORTS by default and exits 0:
      # main.go:200 is `case o.fail && missing > 0: return 1`, so without the
      # flag a README naming API the code lost is a GREEN check that printed
      # the defect. Measured on this repository, 2026-11-22, with the same
      # pinned binary: the tree this lane lands on top of exited 1 with 4
      # MISSING, and the fixed tree exits 0 with 0 MISSING and 2 allowed.
      # Both halves of that A/B matter -- a gate nothing has ever refused is
      # not known to refuse anything.
      #
      # It also exits 2 when a module cannot be read AT ALL, or when no module
      # was read, so a scan that found nothing to look at cannot pass as a
      # clean one.
      #
      # ⛔ WHY A LANE AND NOT A NOTE. Four stale identifiers had accumulated by
      # v0.61.0, two of them for a helper this repository DELETED on purpose
      # and documented deleting. Nobody introduced them in one careless commit:
      # they are what a README does when the code moves and no check reads
      # both. The deliberate ones are kept, with their reason, by a
      # `docsym:allow` comment in the README -- docsym ignores an allow that
      # carries no reason, so the reason is not optional.
      #
      # Pinned, and docsym has not changed since that tag
      # (`git log v0.157.0..HEAD -- cmd/docsym` is empty), so this is the
      # binary the figures above were measured with. Renovate's customManager
      # for this org reads pins inside `run:` blocks.
      - name: docsym --fail
        run: |
          set -eu
          go install github.com/go-fleettools/fleettools/cmd/docsym@v0.182.2
          "$(go env GOPATH)/bin/docsym" --fail .

  # redact.Redactor.Find is fed whatever a language model or its user writes,
  # through the go-llmflow gateway's hide_secrets guard: untrusted input.
  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzFind, pkg: ./redact }
          - { target: FuzzLocateMatchesWholeText, pkg: ./redact }
          # A pull request body is untrusted text, parsed before a merge.
          - { target: FuzzParse, pkg: ./issuegate }
          # S+ and strict S against the production zsh (and bash for S): what the
          # grammar allows with a backtick, the shell must not run (#156).
          - { target: FuzzSplus, pkg: ./plain }
          - { target: FuzzS, pkg: ./plain }
          # The amend rule's word splitter reads arbitrary command text (#149).
          - { target: FuzzCheck, pkg: ./amendmerged }
          # The differential oracle: bash, dash and zsh against the rule.
          - { target: FuzzOracle, pkg: ./literaltick }
          # guard-read scans untrusted file content and reads shell text.
          - { target: FuzzScan, pkg: ./secretread }
          - { target: FuzzOperands, pkg: ./secretread }
          # (FuzzBody, which fuzzed a heredoc body against bash 3.2's scan, was
          # removed with that scan in #156.) zsh is installed by the step below,
          # so no shell goes unasked.
    env:
      GITSAFE_ORACLE_SHELLS: bash,dash,zsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go version
      - name: zsh for the literaltick oracle
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 45s ${{ matrix.pkg }}

  vulns:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      - run: go version
      # ⛔ WHY THIS REPOSITORY OF ALL OF THEM. gitsafe is what the fleet trusts
      # to keep a credential out of a URL, and it had no lane asking whether
      # its own dependencies carry a known advisory. Measured 2026-10-18, built
      # with go1.27.1: EIGHT standard-library advisories reachable from this
      # module, every one of them through glauth.Client.Get -> http.Client.Do,
      # which is real client code and not an init artefact --
      # GO-2026-6603/6605/6607/6608/6610/6611/6613/6617, all fixed in 1.27.2.
      #
      # Nothing shipped was exposed: this CI pins 1.27.2 literally, and the
      # installed binaries and both hook copies are built with 1.27.2. The
      # exposure was the DECLARED FLOOR -- go.mod said `go 1.27.1`, which lets a
      # consumer running `go install ...@latest` with GOTOOLCHAIN=local on
      # 1.27.1 build a vulnerable binary in silence. The floor is now 1.27.2, so
      # that build refuses instead. This lane is what notices the next time.
      # It did, on 2026-10-24: GO-2026-6809 (stdlib, fixed in 1.27.3); the CI
      # and the floor moved to 1.27.3.
      #
      # ⛔ NO `set -o pipefail`, deliberately. govulncheck exits non-zero over
      # findings it has decided this module does not call, and zero over some it
      # has -- which is the whole reason vulngate exists. An unread scan is
      # caught instead by the emptiness check and by vulngate, which believes a
      # run only when it carried a config AND an SBOM.
      #
      # ⛔ -go holds the scan to the toolchain that actually ran: the standard
      # library is judged by ONE version, and a lane that silently resolved
      # another answers a different question. Measured here the same day: the
      # same source built with 1.27.1 reports 8 and with 1.27.2 reports 0, so
      # the toolchain IS the verdict.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.182.2
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          # ⛔ TWO DASHES, AND BEFORE THE PIN MOVES. fleettools converted all 54
          # commands to cobra in its v0.53.0 "with a single-dash compatibility
          # shim and no flag day": `-go` still works, and says so on every run --
          # "this shim will not outlive the next major". A warning inside a GREEN
          # lane is a warning nobody reads, so it would surface as a red night
          # later, for a reason unrelated to anything this lane measures.
          #
          # Safe in both directions, which is why it can land before the bump:
          # Go's own flag package documents that "double dashes are also
          # permitted", so `--go` is accepted by the PINNED v0.20.1 binary here
          # as well as by the cobra one that Renovate's #79 brings (v0.80.0 --
          # proposed by the customManager added to this org's preset on
          # 2026-11-01, which reads pins inside `run:` blocks that no other
          # manager sees).
          "$BIN/vulngate" --go "$(go env GOVERSION)" /tmp/vuln.json

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.4' }
      # ⛔ SAY WHICH TOOLCHAIN RAN. A green check that does not record the
      # compiler behind it makes every figure measured under it unattributable:
      # go.mod said 1.26 on a sibling repository for weeks while its CI asked
      # for `stable` and ran 1.27, and the only way anybody noticed was reading
      # a job log for this line.
      - run: go version
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./...
